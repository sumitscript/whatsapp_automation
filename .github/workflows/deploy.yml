name: Deploy

# Runs after CI passes on main (or manually). Builds the image, pushes it to
# GitHub Container Registry, then rolls it out on the KVM over SSH.
#
# Repository secrets:
#   SSH_HOST      KVM IP / hostname
#   SSH_USER      deploy user (member of the docker group)
#   SSH_KEY       private key for that user
#   SSH_PORT      optional, default 22
#   DEPLOY_PATH   e.g. /opt/whatsapp-ai (must contain a filled-in .env)
#   GHCR_TOKEN    PAT with read:packages, used by the server to pull the image
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "image=ghcr.io/${repo}:${sha::12}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${repo}:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Fails fast with the NAME of the missing/malformed secret (never its value).
      - name: Preflight — secrets and SSH reachability
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          fail=0
          for n in SSH_HOST SSH_USER SSH_KEY DEPLOY_PATH GHCR_TOKEN; do
            if [ -z "${!n}" ]; then echo "::error title=Missing secret::$n is empty or not set (Settings → Environments → production, or repository secrets)"; fail=1; else echo "✓ $n is set"; fi
          done
          [ "$fail" = 0 ] || exit 1
          case "$SSH_HOST" in *://*|*/*|*" "*) echo "::error title=Bad SSH_HOST::must be a bare host or IP, no scheme/path/spaces"; fail=1;; esac
          case "${SSH_PORT:-22}" in ''|*[!0-9]*) echo "::error title=Bad SSH_PORT::must be a number (or unset for 22)"; fail=1;; esac
          head -n1 <<<"$SSH_KEY" | grep -qE '^-----BEGIN [A-Z ]*PRIVATE KEY-----$' || { echo "::error title=Bad SSH_KEY::first line must be a '-----BEGIN … PRIVATE KEY-----' header (paste the whole key, including newlines)"; fail=1; }
          case "$DEPLOY_PATH" in /*) ;; *) echo "::error title=Bad DEPLOY_PATH::must be an absolute path like /opt/whatsapp-ai"; fail=1;; esac
          [ "$fail" = 0 ] || exit 1
          echo "→ TCP check ${SSH_HOST}:${SSH_PORT:-22}"
          if timeout 10 bash -c "exec 3<>/dev/tcp/${SSH_HOST}/${SSH_PORT:-22}"; then echo "✓ port reachable"; else echo "::error title=SSH unreachable::cannot open ${SSH_HOST}:${SSH_PORT:-22} from GitHub runners (firewall/ufw/wrong port/host down)"; exit 1; fi

      - name: Upload compose + proxy config
        uses: appleboy/scp-action@v0.1.7
        with:
          debug: true
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: docker-compose.yml,.env.example,deploy/Caddyfile,deploy/deploy.sh,deploy/backup.sh
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true
      - name: Roll out
        id: rollout
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: APP_IMAGE,GHCR_USER,GHCR_TOKEN,DEPLOY_PATH
          script_stop: true
          script: |
            set -e
            echo "::group::server"; whoami; hostname; date -u; echo "path=$DEPLOY_PATH"; echo "::endgroup::"
            cd "$DEPLOY_PATH" || { echo "✗ DEPLOY_PATH $DEPLOY_PATH does not exist or is not accessible to $(whoami)"; exit 1; }
            ls -la deploy/deploy.sh .env docker-compose.yml || { echo "✗ expected files missing in $DEPLOY_PATH (scp step must succeed; .env must exist)"; exit 1; }
            echo "→ docker login ghcr.io as $GHCR_USER"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin || { echo "✗ GHCR login failed — GHCR_TOKEN needs read:packages (and must not be expired)"; exit 1; }
            APP_IMAGE="$APP_IMAGE" bash deploy/deploy.sh

      # Runs only when a step above failed: collects what you'd otherwise SSH in to look at.
      - name: Diagnostics (on failure)
        if: failure() && steps.rollout.outcome != 'skipped'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_PATH
          script: |
            cd "$DEPLOY_PATH" 2>/dev/null || true
            echo "::group::containers"; docker compose ps -a 2>&1 || docker ps -a 2>&1; echo "::endgroup::"
            echo "::group::gateway logs (last 80)"; docker compose logs --tail=80 gateway 2>&1; echo "::endgroup::"
            echo "::group::worker logs (last 80)"; docker compose logs --tail=80 worker 2>&1; echo "::endgroup::"
            echo "::group::resources"; free -m; df -h / "$DEPLOY_PATH" 2>&1; docker system df 2>&1; echo "::endgroup::"
            echo "::group::.env keys (values hidden)"; sed -E 's/=.*/=<hidden>/' .env 2>&1 | grep -vE '^\s*(#|$)'; echo "::endgroup::"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy ${{ job.status }}"
            echo "- image: \`${{ needs.build.outputs.image }}\`"
            echo "- commit: \`${{ github.event.workflow_run.head_sha || github.sha }}\`"
            echo "- failed step: see the first red ✗ step above; server diagnostics are in **Diagnostics (on failure)**"
          } >> "$GITHUB_STEP_SUMMARY"
